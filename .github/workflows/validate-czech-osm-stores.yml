name: Validate Czech OSM store feed

on:
  pull_request:
    paths:
      - 'czech-osm-stores.json'
      - '.github/workflows/validate-czech-osm-stores.yml'
  push:
    branches: [main]
    paths:
      - 'czech-osm-stores.json'
      - '.github/workflows/validate-czech-osm-stores.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate documented OSM identities, source and bounds
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import datetime
          import hashlib
          import json
          import pathlib
          import re

          file = pathlib.Path("czech-osm-stores.json")
          raw = file.read_bytes()
          assert 1 <= len(raw) <= 2_000_000, "Unexpected feed size"
          data = json.loads(raw)
          assert data["schema_version"] == 1
          assert data["source"] == "OpenStreetMap"
          assert data["source_license"] == "ODbL-1.0"
          assert data["source_url"] == "https://www.openstreetmap.org/copyright"
          assert data["country"] == "CZ"
          stamp = data["snapshot_at"]
          assert stamp.endswith("Z")
          datetime.datetime.fromisoformat(stamp.replace("Z", "+00:00"))
          assert re.fullmatch("[0-9a-f]{64}", data["source_sha256"])
          rows = data["shops"]
          assert isinstance(rows, list) and 1_000 <= len(rows) <= 9_000
          chains = {"Penny", "Kaufland", "Lidl", "Albert", "Billa", "Tesco"}
          ids = set()
          counts = collections.Counter()
          missing_city = 0
          missing_addr = 0
          for row in rows:
              ident = row["osmId"]
              assert isinstance(ident, str) and re.fullmatch(
                  r"(node|way|relation)/[1-9][0-9]*", ident
              )
              assert ident not in ids, f"duplicate OSM ID: {ident}"
              ids.add(ident)
              chain = row["chain"]
              assert chain in chains
              counts[chain] += 1
              assert isinstance(row["name"], str) and 0 < len(row["name"]) <= 120
              assert isinstance(row["address"], str) and len(row["address"]) <= 200
              assert isinstance(row["city"], str) and len(row["city"]) <= 90
              lat, lon = row["latitude"], row["longitude"]
              assert type(lat) in (int, float) and 48.3 <= lat <= 51.2
              assert type(lon) in (int, float) and 11.8 <= lon <= 19
              missing_city += not bool(row["city"])
              missing_addr += row["address"] == "Adresa není v OpenStreetMap uvedena"
          # Approved baseline, fail closed on unexplained modifications/loss.
          assert len(rows) == 1705, counts
          assert counts == dict(
              Penny=440, Kaufland=150, Lidl=335,
              Albert=348, Billa=283, Tesco=149
          ), counts
          # These are upper bounds from the original, unenriched OSM snapshot.
          # Official/RÚIAN enrichment may only improve coverage; equality
          # would reject legitimate, reviewed addresses and municipalities.
          assert missing_city <= 915, missing_city
          assert missing_addr <= 830, missing_addr
          for row in rows:
              provenance = row.get("address_source")
              source_url = row.get("address_source_url")
              assert bool(provenance) == bool(source_url), row["osmId"]
              if provenance:
                  domains = {
                      "OFFICIAL_KAUFLAND_UNIQUE_CITY":
                          "https://prodejny.kaufland.cz/aktualne/servis/prodejna/",
                      "OFFICIAL_PENNY_UNIQUE_OSM_CITY":
                          "https://www.penny.cz/prodejny",
                      "OFFICIAL_TESCO_UNIQUE_CITY":
                          "https://www.itesco.cz/prodejny/",
                  }
                  # Any new official source needs an explicit review of
                  # the allowed origin, not an arbitrary URL.
                  assert provenance in domains, (row["osmId"], provenance)
                  assert source_url.startswith(domains[provenance]), row["osmId"]
                  assert row["city"] and re.search(r"\d", row["address"])
                  assert not row["address"].startswith("Adresa není")
                  if provenance == "OFFICIAL_TESCO_UNIQUE_CITY":
                      assert row.get("address_evidence_city_directory", "").startswith(
                          "https://www.itesco.cz/prodejny/")
                      assert row.get("address_verified_on") == "2026-10-23"
          print("Coverage after verified enrichment:",
                "municipalities", len(rows) - missing_city,
                "nonempty OSM/official addresses", len(rows) - missing_addr)
          print("OSM feed accepted:", len(rows), dict(counts),
                "SHA-256(JSON)", hashlib.sha256(raw).hexdigest(),
                "source PBF", data["source_sha256"])
          PY
